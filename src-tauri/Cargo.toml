[package]
name = "wm-market"
version = "0.1.0"
description = "A focused Warframe market desktop workspace"
authors = ["WM Market"]
edition = "2021"

[lib]
name = "wm_market_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
